name: Optimize Images

on:
  push:
    branches:
      - main
    paths:
      - 'src/img/**'
      - 'optimize.mjs'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-optimize all images'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run image optimization
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run optimize -- --force
          else
            npm run optimize
          fi

      - name: Commit and push optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/img .optimize-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: optimize images"
            git push
          else
            echo "No optimized image changes to commit."
          fi
